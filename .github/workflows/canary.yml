name: Canary desktop builds

# Builds the desktop bundles without publishing a release. It runs once a
# month and can be started by hand, so a broken toolchain, a dependency that
# moved or a build that only works on one platform shows up before a tagged
# release does. The tagged release stays in release.yml.

on:
  schedule:
    - cron: "41 4 1 * *"
  workflow_dispatch:

concurrency:
  group: canary-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS universal
            platform: macos-latest
            args: "--target universal-apple-darwin --bundles dmg"
          - label: Linux x64
            platform: ubuntu-22.04
            args: "--bundles deb,appimage"
          - label: Windows x64
            platform: windows-latest
            args: "--bundles msi,nsis"

    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust and macOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the bundles
        run: npm run build -- ${{ matrix.args }}

      - name: Upload the bundles
        uses: actions/upload-artifact@v4
        with:
          name: FreeDomainBrowser-canary-${{ matrix.label }}
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
