name: Release desktop builds

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS universal
            platform: macos-latest
            args: "--target universal-apple-darwin --bundles dmg"
            signing_identity: "-"
          - label: Linux x64
            platform: ubuntu-22.04
            args: "--bundles deb,appimage"
            signing_identity: ""
          - label: Windows x64
            platform: windows-latest
            args: "--bundles msi,nsis"
            signing_identity: ""

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust and macOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Check release tag matches the app version
        shell: bash
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version $version"
            exit 1
          fi

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # When the Apple secrets are set the build is signed with a Developer
          # ID and notarized; without them it falls back to the ad-hoc identity
          # from the matrix, which is what the public releases use today.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || matrix.signing_identity }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: "Free Domain Browser v__VERSION__"
          releaseBody: |
            Cross-platform desktop builds for Free Domain Browser __VERSION__.

            - macOS: universal DMG (Apple Silicon + Intel)
            - Windows: x64 MSI and NSIS installer
            - Linux: x64 AppImage and Debian package

            Every asset is listed in `checksums.txt` with its SHA-256.

            These builds are ad-hoc signed or unsigned and are not notarized.
            macOS may require you to allow the app under System Settings → Privacy & Security
            on first launch. Windows SmartScreen may ask for confirmation.

            Source code: https://github.com/free-domain-name/tauri-browser
            Registry: https://github.com/free-domain-name/registry
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Sign the Windows installers
        # Optional: it only runs when an Authenticode certificate is stored in
        # the repository secrets. The signed file replaces the uploaded one.
        if: matrix.platform == 'windows-latest' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $pfx = Join-Path $env:RUNNER_TEMP "code-signing.pfx"
          [System.IO.File]::WriteAllBytes(
            $pfx,
            [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          )
          $password = ConvertTo-SecureString `
            -String $env:WINDOWS_CERTIFICATE_PASSWORD `
            -AsPlainText `
            -Force
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password | Out-Null
          $thumbprint = (Get-ChildItem Cert:\CurrentUser\My | Sort-Object NotAfter | Select-Object -Last 1).Thumbprint

          $assets = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\assets" -Force
          gh release download "${env:GITHUB_REF_NAME}" --dir $assets.FullName --pattern "*.msi" --pattern "*.exe"
          Get-ChildItem -Path $assets.FullName -Include *.msi,*.exe -Recurse | ForEach-Object {
            & signtool sign /sha1 $thumbprint /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($_.FullName)" }
            gh release upload "${env:GITHUB_REF_NAME}" $_.FullName --clobber
          }
          Remove-Item -Force $pfx

  checksums:
    name: Checksums
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Download the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "${GITHUB_REF_NAME}" --dir assets

      - name: Publish checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd assets
          shasum -a 256 ./* > checksums.txt
          gh release upload "${GITHUB_REF_NAME}" checksums.txt --clobber

