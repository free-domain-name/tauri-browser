[package]
name = "free-domain-browser"
version = "0.1.0"
description = "A tiny cross-platform browser with free-domain registry resolution"
authors = ["Free Domain Name contributors"]
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-only"
repository = "https://github.com/free-domain-name/tauri-browser"
homepage = "https://free-domain-name.github.io/tauri-browser/"
default-run = "free-domain-browser"

[lib]
name = "free_domain_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Async runtime and timeouts for the registry fetcher / proxy.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "macros"] }

# Registry records are fetched from the GitHub raw CDN; proxied destinations
# are fetched with this client too.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "gzip",
  "brotli",
  "deflate",
  "http2",
] }

# ICANN conflict detection. hickory-resolver is the maintained successor of
# trust-dns-resolver.
hickory-resolver = "0.26"

url = "2"
regex = "1"

# Community chat transport. The relay is plain HTTP/WebSocket (no TLS in
# front); iroh still encrypts endpoint-to-endpoint traffic.
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring"] }
iroh-gossip = { version = "0.102.0", default-features = false, features = ["net"] }
n0-future = "0.3"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }


[features]
# Kept for the Tauri CLI; the app does not need a custom protocol asset loader.
default = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
clap = { version = "4", features = ["derive"] }
